# Example server block for the nginx that ALREADY runs on the host and serves
# other sites. Drop it in /etc/nginx/sites-available/grafiki, symlink it into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# TLS is NOT handled here on purpose. Cloudflare terminates HTTPS for the
# browser and this server only ever speaks plain HTTP - to Cloudflare, and to
# the two containers below. There is no certificate anywhere in this stack,
# so there is nothing for a client-side "connection is untrusted" warning to
# complain about. See README, section "Reverse proxy i TLS (VPS)" for why
# that is correct here and what it trades away.
#
# It expects the application stack to run with plain `docker compose up -d`
# (docker-compose.yml), which publishes:
#   backend  -> 127.0.0.1:8000  (override with BACKEND_PORT in .env)
#   frontend -> 127.0.0.1:8080  (override with FRONTEND_PORT in .env)
#
# Prerequisite - put this ONE line in the http {} block of /etc/nginx/nginx.conf
# (or drop the file into /etc/nginx/conf.d/, which is included from there):
#
#     include /etc/nginx/conf.d/cloudflare-real-ip.conf;
#
# The file is docs/cloudflare-real-ip.conf in this repository, generated by
# scripts/update-cloudflare-ips.sh. Without it every visitor arrives as a
# Cloudflare address and the rate limiter treats them as one client.

server {
    listen 80;
    listen [::]:80;
    server_name grafiki.mednes.pl;

    # The application sends its own security headers (CSP, X-Frame-Options,
    # Referrer-Policy...) from FastAPI; do not add_header them again here or
    # the two sets will fight.

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # $remote_addr is already the real visitor thanks to the Cloudflare
        # real-IP include above. Setting the header to it - rather than
        # appending with $proxy_add_x_forwarded_for - also drops any
        # X-Forwarded-For a client tried to inject.
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The browser's connection is https (Cloudflare terminates it); this
        # hop to the backend is not, so state the original protocol
        # explicitly rather than letting nginx default to "http".
        proxy_set_header X-Forwarded-Proto https;

        # Generating a month with OR-Tools can take as long as
        # SOLVER_TIME_LIMIT_SECONDS; nginx's default 60 s would cut it off.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ---------------------------------------------------------------------------
# Cloudflare dashboard settings that matter
# ---------------------------------------------------------------------------
#
# SSL/TLS -> Overview -> encryption mode: **Flexible**.
#
#   Flexible         Browser <-> Cloudflare is HTTPS with Cloudflare's own,
#                     universally trusted certificate. Cloudflare <-> this
#                     server is plain HTTP, exactly what the server block
#                     above speaks. No certificate to manage or distrust.
#   Full / strict     Would need a certificate on this server again - the
#                     thing we are deliberately not doing. Do not use these
#                     without also restoring nginx/certs and a 443 block.
#
# The session cookie still gets marked Secure correctly in Flexible mode:
# the backend decides that purely from APP_ENV=production, not from the
# request's scheme, and the browser only ever sees this site over the https
# connection to Cloudflare - the plain-HTTP hop behind Cloudflare is not
# visible to it. What Flexible mode gives up is encryption on that one
# internal hop (Cloudflare's network to this VPS); everything the browser
# sends is still encrypted end to end from the visitor's point of view.
#
# Timeout: Cloudflare drops a request after 100 s and shows error 524.
# SOLVER_TIME_LIMIT_SECONDS defaults to 60 s, which fits. Raising it above
# roughly 90 s makes schedule generation fail in the browser while the solver
# keeps running on the server.
#
# IPv6: if the AAAA record is the one in use, keep the `listen [::]` line -
# an IPv4-only server block would simply never be reached.
#
# Optional hardening once everything works: a firewall that only accepts
# port 80 on this host from Cloudflare's published IP ranges (see
# docs/cloudflare-real-ip.conf for the list). Without it, anyone who finds
# the VPS's bare IP address can reach the application directly, bypassing
# Cloudflare - and could forge X-Forwarded-For, since nothing upstream of
# this nginx would be restoring it from a trusted source anymore.
