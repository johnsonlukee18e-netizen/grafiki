# Example server block for an nginx that ALREADY runs on the host and serves
# other sites. Drop it in /etc/nginx/sites-available/grafiki, symlink it into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# It expects the application stack to run with docker-compose.behind-proxy.yml,
# which publishes the bundled nginx on 127.0.0.1:8080 only.
#
# Cloudflare notes are at the bottom - read them, two of them bite silently.

server {
    listen 80;
    listen [::]:80;
    server_name grafiki.twoja-domena.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafiki.twoja-domena.pl;

    ssl_certificate     /etc/letsencrypt/live/grafiki.twoja-domena.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafiki.twoja-domena.pl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HSTS belongs here, not in the container: this is the TLS endpoint.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The application sends its own CSP, X-Frame-Options and friends; do not
    # add_header them again here or the two sets will fight.

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Hardcoded https: this block only ever serves TLS. The backend needs
        # it to accept that the session cookie may be marked Secure.
        proxy_set_header X-Forwarded-Proto https;

        # Generating a month with OR-Tools can take as long as
        # SOLVER_TIME_LIMIT_SECONDS; the default 60 s must not be cut short.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# ---------------------------------------------------------------------------
# Cloudflare
# ---------------------------------------------------------------------------
#
# 1. REAL CLIENT IP. With the orange cloud on, $remote_addr is a Cloudflare
#    address, so X-Forwarded-For would carry Cloudflare's IP as the client and
#    the rate limiting would key on it. Restore the real address:
#
#      # /etc/nginx/conf.d/cloudflare.conf - refresh from
#      # https://www.cloudflare.com/ips-v4 and /ips-v6
#      set_real_ip_from 173.245.48.0/20;
#      ... (all Cloudflare ranges, IPv4 and IPv6) ...
#      real_ip_header CF-Connecting-IP;
#
# 2. PROXY TIMEOUT. Cloudflare drops a request after 100 s and shows error
#    524. SOLVER_TIME_LIMIT_SECONDS defaults to 60 s, which fits - but raising
#    it above roughly 90 s will make schedule generation fail in the browser
#    while the solver keeps running on the server. Either keep the limit below
#    that, or turn the orange cloud off for this hostname.
#
# 3. SSL MODE. Use "Full (strict)" together with a real certificate on the
#    origin. "Flexible" would make Cloudflare talk plain HTTP to the server,
#    the backend would then see X-Forwarded-Proto http, refuse to consider the
#    connection secure, and the login cookie would never stick.
#
# 4. IPv6. The record points at an IPv6 address, so keep the `listen [::]:443`
#    lines above - an IPv4-only server block would simply never be reached.
