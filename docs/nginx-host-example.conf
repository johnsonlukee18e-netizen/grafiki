# Server block for an nginx that ALREADY runs on the host and serves other
# sites, with Cloudflare in front. Written for the mednes.pl deployment;
# change the hostname and certificate paths for another domain.
#
#   /etc/nginx/sites-available/grafiki
#   ln -s /etc/nginx/sites-available/grafiki /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# It expects the stack to run with docker-compose.behind-proxy.yml, which
# publishes the bundled nginx on 127.0.0.1:8080 only.
#
# Prerequisite - put this ONE line in the http {} block of /etc/nginx/nginx.conf
# (or drop the file into /etc/nginx/conf.d/, which is included from there):
#
#     include /etc/nginx/conf.d/cloudflare-real-ip.conf;
#
# The file is generated by scripts/update-cloudflare-ips.sh. Without it every
# visitor arrives as a Cloudflare address and shares one rate limiting bucket.

server {
    listen 80;
    listen [::]:80;
    server_name grafiki.mednes.pl;

    # Keep this reachable if you renew the origin certificate with certbot
    # over HTTP-01; Cloudflare proxies the challenge path through.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafiki.mednes.pl;

    # --- origin certificate -------------------------------------------------
    # Cloudflare secures the browser side; this certificate secures the leg
    # between Cloudflare and this server. Two workable choices:
    #
    #   a) Cloudflare Origin CA  (SSL/TLS -> Origin Server -> Create Certificate)
    #      Free, valid 15 years, no renewal. Trusted by Cloudflare but NOT by
    #      browsers, so anything reaching this server directly (monitoring, an
    #      IP check, a grey-clouded record) will still report it as untrusted.
    #
    #   b) Let's Encrypt
    #      Trusted by everybody including direct access, needs renewal.
    #      Works behind the orange cloud: Cloudflare passes the HTTP-01
    #      challenge through the location block above.
    #
    # Pick (b) if other systems check this host directly - that is exactly the
    # "self-signed certificate" complaint.
    ssl_certificate     /etc/letsencrypt/live/grafiki.mednes.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafiki.mednes.pl/privkey.pem;
    # For Cloudflare Origin CA instead:
    # ssl_certificate     /etc/ssl/cloudflare/mednes.pl.pem;
    # ssl_certificate_key /etc/ssl/cloudflare/mednes.pl.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS belongs here, not in the container: this is the TLS endpoint.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The application sends its own CSP, X-Frame-Options and friends; do not
    # add_header them again here or the two sets will fight.

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # $remote_addr is already the real visitor thanks to the Cloudflare
        # real-IP include. Setting the header to it - rather than appending
        # with $proxy_add_x_forwarded_for - also drops any X-Forwarded-For a
        # client tried to inject.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;

        # Hardcoded https: this block only ever serves TLS. The backend needs
        # it to accept that the session cookie may be marked Secure - without
        # it the login succeeds and is then immediately forgotten.
        proxy_set_header X-Forwarded-Proto https;

        # Generating a month with OR-Tools can take as long as
        # SOLVER_TIME_LIMIT_SECONDS; nginx's default 60 s would cut it off.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# ---------------------------------------------------------------------------
# Cloudflare dashboard settings that matter
# ---------------------------------------------------------------------------
#
# SSL/TLS -> Overview -> encryption mode:
#
#   Flexible        NEVER. Cloudflare would talk plain HTTP to this server, the
#                   backend would see X-Forwarded-Proto: http, refuse to treat
#                   the connection as secure, and logging in would never stick.
#   Full            Encrypted to the origin but the certificate is not checked,
#                   so a self-signed one "works" - and is exactly why some
#                   systems report the certificate as untrusted.
#   Full (strict)   Correct. Requires a real certificate here: Origin CA or
#                   Let's Encrypt, as above.
#
# Timeout: Cloudflare drops a request after 100 s and shows error 524.
# SOLVER_TIME_LIMIT_SECONDS defaults to 60 s, which fits. Raising it above
# roughly 90 s makes schedule generation fail in the browser while the solver
# keeps running on the server.
#
# IPv6: if the AAAA record is the one in use, keep the `listen [::]` lines -
# an IPv4-only server block would simply never be reached.
#
# Optional hardening once everything works: SSL/TLS -> Origin Server ->
# Authenticated Origin Pulls, plus a firewall that only accepts 443 from the
# Cloudflare ranges. Then nobody can reach the origin except through Cloudflare.
