# Serves the built SPA. TLS, security headers and /api routing are handled by
# the reverse proxy already running on the VPS host (see README, section
# "Reverse proxy i TLS"), and by the backend itself for its own responses.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets never change - cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a deploy is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
