name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests on PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nurse
          POSTGRES_PASSWORD: nurse
          POSTGRES_DB: nurse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nurse -d nurse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://nurse:nurse@localhost:5432/nurse
      SESSION_SECRET: ci-session-secret-key-at-least-32-characters
      DEV_AUTH_ENABLED: "true"
      RATE_LIMIT_ENABLED: "false"
      SOLVER_TIME_LIMIT_SECONDS: "20"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Check migrations match the models
        working-directory: backend
        run: |
          alembic upgrade head
          # An empty autogenerate diff proves the migrations are up to date.
          alembic check

      - name: Tests
        working-directory: backend
        run: pytest -q --maxfail=1

  frontend:
    name: Frontend (types + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          # Placeholder values so the required-variable checks pass.
          sed -i 's|^SESSION_SECRET=.*|SESSION_SECRET=ci-placeholder-secret-at-least-32-characters|' .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-placeholder|' .env
          sed -i 's|^FRONTEND_URL=.*|FRONTEND_URL=https://example.test|' .env
          sed -i 's|^SERVER_NAME=.*|SERVER_NAME=example.test|' .env
          docker compose config --quiet
          rm .env
