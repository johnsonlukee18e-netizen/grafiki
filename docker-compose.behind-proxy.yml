# Overlay for a server that already runs its own nginx / reverse proxy.
#
# The bundled nginx stops binding 80 and 443 and instead listens on the
# loopback interface only; the host proxy terminates TLS and forwards to it.
#
# Activate it by adding this line to .env (Compose reads COMPOSE_FILE from
# there, so plain `docker compose up -d` and the deployment pick it up):
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.behind-proxy.yml
#   TLS_TERMINATION=host
#   APP_PORT=8080
#
# See README, section "Wariant: wlasny nginx na hoscie".

services:
  nginx:
    # Replace the published ports instead of adding to them - a merged list
    # would still try to grab 80/443 and fail with "address already in use".
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes: !override
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates-src:ro
    command: >
      /bin/sh -c "envsubst '$$SERVER_NAME'
      < /etc/nginx/templates-src/app-behind-proxy.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
