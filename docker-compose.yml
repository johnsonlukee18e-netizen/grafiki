# Production stack: nginx -> frontend (static SPA) + backend (FastAPI) -> postgres
# Start with:  docker compose up -d --build

name: nurse

services:
  postgres:
    image: postgres:16-alpine
    container_name: nurse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Deterministic collation so ORDER BY on names never shifts between hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    # Not published on the host: only the backend may reach the database.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nurse_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-28800}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
      AUTO_ACTIVATE_NEW_USERS: ${AUTO_ACTIVATE_NEW_USERS:-false}
      SOLVER_TIME_LIMIT_SECONDS: ${SOLVER_TIME_LIMIT_SECONDS:-60}
      SOLVER_SEED: ${SOLVER_SEED:-42}
      SOLVER_WORKERS: ${SOLVER_WORKERS:-8}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-300}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-20}
      # Applies migrations on every start; set SEED_DEMO=true only for a demo.
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_DEMO: ${SEED_DEMO:-false}
    networks:
      - internal
    # No ports published: only nginx talks to the API.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nurse_frontend
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: nurse_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates-src:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot
    command: >
      /bin/sh -c "envsubst '$$SERVER_NAME'
      < /etc/nginx/templates-src/app.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

volumes:
  postgres_data:
    name: nurse_postgres_data
  certbot_www:
    name: nurse_certbot_www

networks:
  internal:
    driver: bridge
