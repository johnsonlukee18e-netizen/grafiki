[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI dependency defaults are the documented idiom
    "E501",  # long lines are reported by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # test env vars must be set before importing the app

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
